name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gratitude
          POSTGRES_PASSWORD: gratitude
          POSTGRES_DB: gratitude_stories
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gratitude -d gratitude_stories"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgres://gratitude:gratitude@localhost:5432/gratitude_stories
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgres://gratitude:gratitude@localhost:5432/gratitude_stories
      - run: npm run typecheck
      # TEST_DATABASE_URL turns on the PostgreSQL integration tests against the freshly migrated database.
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://gratitude:gratitude@localhost:5432/gratitude_stories
